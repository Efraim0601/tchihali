<head>

<title>Onboarding 3 — Consultations</title>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.95)}
polyline{stroke-dasharray:1000;animation:tcDraw 1.6s ease-out both}
.tc-float{animation:tcFloat 5s ease-in-out infinite}
.tc-pulse{animation:tcPulse 2s ease-out infinite}
.tc-bar{transform-origin:left;animation:tcGrow 1s cubic-bezier(.2,.8,.2,1) .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; padding: 56px 28px 40px; overflow: hidden">
  <a href="Onboarding2.dc.html" aria-label="{{ t.back }}" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2F3437; box-shadow: 0 2px 10px rgba(47,52,55,0.06)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center">
    <div style="width: 280px; height: 280px; border-radius: 50%; background: #E7EFE4; display: flex; align-items: center; justify-content: center">
      <div class="tc-float" style="width: 190px; padding: 18px; box-sizing: border-box; border-radius: 26px; background: #FFFFFF; box-shadow: 0 12px 30px rgba(47,52,55,0.10); display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #F6C7B4; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #7A3522">EM</div>
        <div style="font-size: 14px; font-weight: 600">{{ t.card }}</div>
        <div style="width: 100%; height: 40px; border-radius: 12px; background: #4F7A5A; color: #FFFFFF; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center">{{ t.confirmed }}</div>
      </div>
    </div>
  </div>
  <div style="display: flex; gap: 8px; margin-bottom: 24px">
    <span style="width: 8px; height: 8px; border-radius: 8px; background: #D5DED2"></span>
    <span style="width: 8px; height: 8px; border-radius: 8px; background: #D5DED2"></span>
    <span style="width: 28px; height: 8px; border-radius: 8px; background: #4F7A5A"></span>
  </div>
  <h1 style="margin: 0 0 12px; font-size: 30px; line-height: 1.2; font-weight: 700; white-space: pre-line">{{ t.title }}</h1>
  <p style="margin: 0 0 32px; font-size: 16px; line-height: 1.55; color: #646B6F">{{ t.text }}</p>
  <a href="Inscription.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #4F7A5A; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">{{ t.cta }}</a>
</div>
