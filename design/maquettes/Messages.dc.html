<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.95)}
polyline{stroke-dasharray:1000;animation:tcDraw 1.6s ease-out both}
.tc-float{animation:tcFloat 5s ease-in-out infinite}
.tc-pulse{animation:tcPulse 2s ease-out infinite}
.tc-bar{transform-origin:left;animation:tcGrow 1s cubic-bezier(.2,.8,.2,1) .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 16px 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 0 0 26px 26px; box-shadow: 0 4px 16px rgba(47,52,55,0.05)">
    <div style="position: relative">
      <div style="width: 48px; height: 48px; border-radius: 16px; background: #F6C7B4; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #7A3522">EM</div>
      <span style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: #4F9A5E; border: 3px solid #FFFFFF"></span>
    </div>
    <div style="flex: 1">
      <div style="font-size: 16px; font-weight: 600">Estelle Mbarga</div>
      <div style="font-size: 12px; color: #3E6448">{{ t.online }}</div>
    </div>
    <a href="SalleAttente.dc.html" aria-label="{{ t.call }}" style="width: 44px; height: 44px; border-radius: 14px; background: #E7EFE4; color: #3E6448; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="10" rx="3"/><path d="M16 11l5-3v8l-5-3"/></svg></a>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end">
    <div style="align-self: center; padding: 5px 12px; border-radius: 10px; background: #EFEAE2; font-size: 12px; font-weight: 500; color: #646B6F">{{ t.today }}</div>
    <div style="align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; gap: 4px; align-items: flex-end">
      <div style="width: 190px; height: 112px; border-radius: 20px 20px 6px 20px; overflow: hidden">
        <svg width="190" height="112" viewBox="0 0 200 120" aria-hidden="true" style="display: block"><rect width="200" height="120" fill="#D9C7AB"/><circle cx="100" cy="60" r="48" fill="#FFFFFF"/><circle cx="100" cy="60" r="38" fill="#F5EFE4"/><circle cx="90" cy="54" r="22" fill="#7A9A3E"/><ellipse cx="114" cy="72" rx="16" ry="10" fill="#F2EAD6"/><circle cx="118" cy="44" r="7" fill="#C97B4E"/></svg>
      </div>
      <div style="padding: 10px 14px; border-radius: 18px 18px 6px 18px; background: #4F7A5A; color: #FFFFFF; font-size: 15px; line-height: 1.45">{{ t.m1 }}</div>
      <span style="font-size: 11px; color: #646B6F">09:12</span>
    </div>
    <div style="align-self: flex-start; max-width: 80%; display: flex; flex-direction: column; gap: 4px">
      <div style="padding: 10px 14px; border-radius: 18px 18px 18px 6px; background: #FFFFFF; font-size: 15px; line-height: 1.45; box-shadow: 0 2px 8px rgba(47,52,55,0.05)">{{ t.m2 }}</div>
      <span style="font-size: 11px; color: #646B6F">10:40</span>
    </div>
    <sc-for list="{{ sent }}" as="m" hint-placeholder-count="0">
      <div style="align-self: flex-end; max-width: 78%; padding: 10px 14px; border-radius: 18px 18px 6px 18px; background: #4F7A5A; color: #FFFFFF; font-size: 15px; line-height: 1.45">{{ m.text }}</div>
    </sc-for>
  </div>
  <div style="padding: 8px 12px 10px; display: flex; gap: 8px; align-items: center">
    <button aria-label="{{ t.photo }}" style="width: 48px; height: 48px; border-radius: 16px; border: none; background: #FFFFFF; color: #646B6F; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(47,52,55,0.05)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <input aria-label="{{ t.write }}" value="{{ draft }}" onChange="{{ onType }}" placeholder="{{ t.write }}" style="flex: 1; min-width: 0; height: 48px; border-radius: 16px; border: 1.5px solid #E4DED4; background: #FFFFFF; padding: 0 14px; font-size: 15px; color: #2F3437">
    <button onClick="{{ send }}" aria-label="{{ t.send }}" style="width: 48px; height: 48px; border-radius: 16px; border: none; background: #E0704F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
  </div>
  <nav style="display: flex; justify-content: space-around; padding: 8px 6px 24px; background: #FFFFFF; border-top: 1px solid #EFEAE2">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>{{ n.home }}</a>
    <a href="Reservation.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>{{ n.agenda }}</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>{{ n.journal }}</a>
    <a href="Messages.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #3E6448; font-size: 11px; font-weight: 700"><span style="display: flex; padding: 2px 14px; border-radius: 12px; background: #E7EFE4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span>{{ n.messages }}</a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>{{ n.profile }}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr","section":"Langue"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { draft: '', sent: [] }; }
  renderVals() {
    const L = this.props.lang || 'fr';
    const fr = L === 'fr';
    const t = fr
      ? { online: 'En ligne · répond sous 24 h', call: 'Appel vidéo', today: 'Aujourd\'hui', m1: 'Mon dîner d\'hier : ndolé et plantain. La portion est bonne ?', m2: 'Très belle assiette ! La portion est parfaite. Juste un peu moins d\'huile.', photo: 'Envoyer une photo', write: 'Écrire un message…', send: 'Envoyer' }
      : { online: 'Online · replies within 24 h', call: 'Video call', today: 'Today', m1: 'Last night\'s dinner: ndolé and plantain. Is the portion okay?', m2: 'Lovely plate! The portion is perfect. Just a little less oil.', photo: 'Send a photo', write: 'Write a message…', send: 'Send' };
    const n = fr ? { home: 'Accueil', agenda: 'Agenda', journal: 'Journal', messages: 'Messages', profile: 'Profil' } : { home: 'Home', agenda: 'Schedule', journal: 'Journal', messages: 'Messages', profile: 'Profile' };
    return {
      t, n,
      draft: this.state.draft, sent: this.state.sent,
      onType: (e) => this.setState({ draft: e.target.value }),
      send: () => { const x = this.state.draft.trim(); if (x) this.setState({ sent: this.state.sent.concat([{ text: x }]), draft: '' }); }
    };
  }
}
</script>
</body>
</html>
