<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Salle d'attente / Waiting room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.95)}
polyline{stroke-dasharray:1000;animation:tcDraw 1.6s ease-out both}
.tc-float{animation:tcFloat 5s ease-in-out infinite}
.tc-pulse{animation:tcPulse 2s ease-out infinite}
.tc-bar{transform-origin:left;animation:tcGrow 1s cubic-bezier(.2,.8,.2,1) .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; padding: 52px 20px 34px; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Accueil.dc.html" aria-label="{{ t.leave }}" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2F3437; box-shadow: 0 2px 10px rgba(47,52,55,0.06)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">{{ t.title }}</h1>
  </div>
  <div style="height: 340px; border-radius: 28px; background: #3B4A40; position: relative; overflow: hidden">
    <sc-if value="{{ cam }}" hint-placeholder-val="{{ true }}">
      <svg width="350" height="340" viewBox="0 0 350 340" aria-hidden="true" style="display: block"><rect width="350" height="340" fill="#C9D6C3"/><rect width="120" height="340" fill="#BCCBB6"/><circle cx="175" cy="150" r="52" fill="#7A5038"/><path d="M120 140c0-42 30-64 55-64s55 22 55 64c-10-22-30-30-55-30s-45 8-55 30z" fill="#2E2420"/><path d="M78 340c8-80 50-112 97-112s89 32 97 112z" fill="#E39A6F"/></svg>
    </sc-if>
    <sc-if value="{{ camOff }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #FFFFFF"><div style="width: 84px; height: 84px; border-radius: 50%; background: #F6C7B4; color: #7A3522; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700">NN</div><span style="font-weight: 500">{{ t.camOff }}</span></div>
    </sc-if>
    <div style="position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px">
      <button onClick="{{ toggleMic }}" aria-label="{{ t.mic }}" aria-pressed="{{ mic }}" style="{{ micStyle }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button onClick="{{ toggleCam }}" aria-label="{{ t.camera }}" aria-pressed="{{ cam }}" style="{{ camStyle }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="10" rx="3"/><path d="M16 11l5-3v8l-5-3"/></svg></button>
    </div>
  </div>
  <section style="background: #FFFFFF; border-radius: 24px; padding: 16px; box-shadow: 0 4px 16px rgba(47,52,55,0.05); display: flex; gap: 14px; align-items: center">
    <div style="width: 52px; height: 52px; border-radius: 18px; background: #F6C7B4; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #7A3522">EM</div>
    <div style="flex: 1">
      <div style="font-weight: 600; font-size: 16px">{{ t.coming }}</div>
      <div style="font-size: 14px; color: #646B6F">{{ t.eta }}</div>
    </div>
    <span class="tc-pulse" style="width: 12px; height: 12px; border-radius: 50%; background: #E9B949"></span>
  </section>
  <div style="flex: 1"></div>
  <a href="Teleconsultation.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 18px; background: #4F7A5A; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">{{ t.enter }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr","section":"Langue"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mic: true, cam: true }; }
  renderVals() {
    const L = this.props.lang || 'fr';
    const t = {
      fr: { leave: 'Quitter', title: 'Salle d\'attente', camOff: 'Caméra coupée', mic: 'Micro', camera: 'Caméra', coming: 'Estelle arrive', eta: 'Dans 2 minutes environ', enter: 'Entrer en consultation' },
      en: { leave: 'Leave', title: 'Waiting room', camOff: 'Camera off', mic: 'Microphone', camera: 'Camera', coming: 'Estelle is on her way', eta: 'In about 2 minutes', enter: 'Join the consultation' }
    }[L];
    const on = 'width: 56px; height: 56px; border-radius: 20px; border: none; background: rgba(255,255,255,0.92); color: #2F3437; display: flex; align-items: center; justify-content: center';
    const off = 'width: 56px; height: 56px; border-radius: 20px; border: none; background: #C4533A; color: #FFFFFF; display: flex; align-items: center; justify-content: center';
    return {
      t, mic: this.state.mic, cam: this.state.cam, camOff: !this.state.cam,
      micStyle: this.state.mic ? on : off, camStyle: this.state.cam ? on : off,
      toggleMic: () => this.setState({ mic: !this.state.mic }),
      toggleCam: () => this.setState({ cam: !this.state.cam })
    };
  }
}
</script>
</body>
</html>
