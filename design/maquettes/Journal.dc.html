<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal alimentaire / Food journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.95)}
polyline{stroke-dasharray:1000;animation:tcDraw 1.6s ease-out both}
.tc-float{animation:tcFloat 5s ease-in-out infinite}
.tc-pulse{animation:tcPulse 2s ease-out infinite}
.tc-bar{transform-origin:left;animation:tcGrow 1s cubic-bezier(.2,.8,.2,1) .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 20px 8px; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">{{ t.title }}</h1>
    <a href="Recettes.dc.html" style="height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(47,52,55,0.06); display: flex; align-items: center; gap: 6px; text-decoration: none; color: #2F3437; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/></svg>{{ t.recipes }}</a>
  </div>
  <div style="padding: 0 20px 8px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="{{ t.prev }}" style="width: 44px; height: 44px; border: none; background: transparent; color: #646B6F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="text-align: center"><div style="font-size: 15px; font-weight: 600">{{ t.today }}</div><div style="font-size: 13px; color: #646B6F">1 260 / 1 700 kcal</div></div>
    <button aria-label="{{ t.nextDay }}" style="width: 44px; height: 44px; border: none; background: transparent; color: #C9C2B6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #FFFFFF; border-radius: 24px; padding: 12px; box-shadow: 0 4px 16px rgba(47,52,55,0.06); display: flex; flex-direction: column; gap: 12px">
      <div style="height: 150px; border-radius: 18px; position: relative; overflow: hidden">
        <svg width="326" height="150" viewBox="0 0 326 150" aria-hidden="true" style="display: block"><rect width="326" height="150" fill="#D9C7AB"/><path d="M0 110h326v40H0z" fill="#C9B391"/><circle cx="163" cy="78" r="68" fill="#FFFFFF"/><circle cx="163" cy="78" r="56" fill="#F5EFE4"/><ellipse cx="144" cy="64" rx="28" ry="21" fill="#F3E3B8"/><ellipse cx="182" cy="90" rx="28" ry="11" fill="#C97B4E" transform="rotate(-18 182 90)"/><circle cx="142" cy="102" r="10" fill="#7FA77F"/><circle cx="156" cy="110" r="8" fill="#5E8A62"/><circle cx="192" cy="56" r="8" fill="#E8775F"/></svg>
        <span style="position: absolute; left: 10px; top: 10px; padding: 6px 10px; border-radius: 12px; background: rgba(255,255,255,0.95); font-size: 12px; font-weight: 600; color: #2F5238">{{ t.lunch }} · 13:05</span>
      </div>
      <div style="padding: 0 4px; display: flex; justify-content: space-between; align-items: center">
        <div style="font-size: 16px; font-weight: 600">{{ t.dish }}</div>
        <div style="font-size: 18px; font-weight: 700">540 <span style="font-size: 12px; color: #646B6F; font-weight: 500">kcal</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 4px 4px">
        <div><div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 500"><span>{{ t.p }}</span><span>32 g</span></div><div style="height: 6px; border-radius: 6px; background: #EFEAE2; margin-top: 5px"><div class="tc-bar" style="width: 72%; height: 6px; border-radius: 6px; background: #4F7A5A"></div></div></div>
        <div><div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 500"><span>{{ t.c }}</span><span>68 g</span></div><div style="height: 6px; border-radius: 6px; background: #EFEAE2; margin-top: 5px"><div class="tc-bar" style="width: 58%; height: 6px; border-radius: 6px; background: #E9B949"></div></div></div>
        <div><div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 500"><span>{{ t.f }}</span><span>14 g</span></div><div style="height: 6px; border-radius: 6px; background: #EFEAE2; margin-top: 5px"><div class="tc-bar" style="width: 34%; height: 6px; border-radius: 6px; background: #E0704F"></div></div></div>
      </div>
    </section>
    <section style="background: #FFFFFF; border-radius: 24px; padding: 16px; box-shadow: 0 4px 16px rgba(47,52,55,0.05); display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">{{ t.mood }}</h2>
      <div style="display: flex; justify-content: space-between">
        <sc-for list="{{ moods }}" as="m" hint-placeholder-count="5">
          <button onClick="{{ m.pick }}" aria-label="{{ m.label }}" aria-pressed="{{ m.on }}" style="{{ m.style }}">
            <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="15" cy="15" r="12"/><circle cx="11" cy="12.5" r="0.9" fill="currentColor"/><circle cx="19" cy="12.5" r="0.9" fill="currentColor"/><path d="{{ m.mouth }}"/></svg>
          </button>
        </sc-for>
      </div>
      <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 600">{{ t.symptoms }}</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ symptoms }}" as="s" hint-placeholder-count="4">
          <button onClick="{{ s.toggle }}" aria-pressed="{{ s.on }}" style="{{ s.style }}">{{ s.label }}</button>
        </sc-for>
      </div>
    </section>
  </div>
  <nav style="display: flex; justify-content: space-around; padding: 8px 6px 24px; background: #FFFFFF; border-top: 1px solid #EFEAE2">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>{{ n.home }}</a>
    <a href="Reservation.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>{{ n.agenda }}</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #3E6448; font-size: 11px; font-weight: 700"><span style="display: flex; padding: 2px 14px; border-radius: 12px; background: #E7EFE4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg></span>{{ n.journal }}</a>
    <a href="Messages.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>{{ n.messages }}</a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>{{ n.profile }}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr","section":"Langue"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mood: 3, sym: { 0: true } }; }
  renderVals() {
    const L = this.props.lang || 'fr';
    const fr = L === 'fr';
    const t = fr
      ? { title: 'Journal', recipes: 'Recettes', prev: 'Jour précédent', nextDay: 'Jour suivant', today: 'Aujourd\'hui', lunch: 'Déjeuner', dish: 'Poisson braisé, miondo', p: 'Prot.', c: 'Gluc.', f: 'Lip.', mood: 'Comment vous sentez-vous ?', symptoms: 'Après le repas', moods: ['Très mal', 'Pas bien', 'Neutre', 'Bien', 'Très bien'], syms: ['Ballonnements', 'Fatigue', 'Faim rapide', 'Rien de spécial'] }
      : { title: 'Journal', recipes: 'Recipes', prev: 'Previous day', nextDay: 'Next day', today: 'Today', lunch: 'Lunch', dish: 'Grilled fish, miondo', p: 'Prot.', c: 'Carbs', f: 'Fat', mood: 'How do you feel?', symptoms: 'After the meal', moods: ['Very bad', 'Not good', 'Neutral', 'Good', 'Very good'], syms: ['Bloating', 'Tiredness', 'Hungry soon', 'Nothing special'] };
    const n = fr ? { home: 'Accueil', agenda: 'Agenda', journal: 'Journal', messages: 'Messages', profile: 'Profil' } : { home: 'Home', agenda: 'Schedule', journal: 'Journal', messages: 'Messages', profile: 'Profile' };
    const mouths = ['M10 21c3-3 7-3 10 0', 'M10 20c3-1.5 7-1.5 10 0', 'M10 19h10', 'M10 18c3 2 7 2 10 0', 'M9 17c3 4 9 4 12 0'];
    const sym = this.state.sym;
    return {
      t, n,
      moods: mouths.map((m, i) => ({
        mouth: m, label: t.moods[i], on: i === this.state.mood,
        pick: () => this.setState({ mood: i }),
        style: 'width: 54px; height: 54px; border-radius: 18px; border: none; display: flex; align-items: center; justify-content: center; ' + (i === this.state.mood ? 'background: #FCE9E0; color: #A9482F; transform: scale(1.08)' : 'background: #F5F1EA; color: #646B6F')
      })),
      symptoms: t.syms.map((label, i) => ({
        label, on: !!sym[i],
        toggle: () => this.setState({ sym: Object.assign({}, sym, { [i]: !sym[i] }) }),
        style: 'height: 42px; padding: 0 14px; border-radius: 14px; font-size: 14px; ' + (sym[i] ? 'border: 1.5px solid #4F7A5A; background: #4F7A5A; color: #FFFFFF; font-weight: 600' : 'border: 1.5px solid #E4DED4; background: #FAF7F2; color: #2F3437; font-weight: 500')
      }))
    };
  }
}
</script>
</body>
</html>
