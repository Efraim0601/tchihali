<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Paiement / Payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.95)}
polyline{stroke-dasharray:1000;animation:tcDraw 1.6s ease-out both}
.tc-float{animation:tcFloat 5s ease-in-out infinite}
.tc-pulse{animation:tcPulse 2s ease-out infinite}
.tc-bar{transform-origin:left;animation:tcGrow 1s cubic-bezier(.2,.8,.2,1) .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 20px 10px; display: flex; align-items: center; gap: 12px">
    <a href="Reservation.dc.html" aria-label="{{ t.back }}" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2F3437; box-shadow: 0 2px 10px rgba(47,52,55,0.06)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">{{ t.title }}</h1>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <section style="background: #E7EFE4; border-radius: 22px; padding: 16px; display: flex; gap: 12px; align-items: center">
      <div style="width: 48px; height: 48px; border-radius: 16px; background: #F6C7B4; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #7A3522">EM</div>
      <div>
        <div style="font-weight: 600; font-size: 15px">Estelle Mbarga · {{ t.video }}</div>
        <div style="font-size: 13px; color: #3E4F43">{{ t.when }}</div>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600">{{ t.how }}</h2>
      <sc-for list="{{ methods }}" as="m" hint-placeholder-count="4">
        <button onClick="{{ m.pick }}" style="{{ m.style }}">
          <span style="{{ m.logoStyle }}">{{ m.short }}</span>
          <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 600; color: #2F3437">{{ m.label }}</span>
          <span style="{{ m.radio }}"></span>
        </button>
      </sc-for>
    </section>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="num" style="font-size: 14px; font-weight: 600">{{ t.number }}</label>
        <input id="num" inputmode="tel" value="+237 677 21 36 90" style="height: 54px; border-radius: 16px; border: 1.5px solid #E4DED4; background: #FFFFFF; padding: 0 16px; font-size: 16px; color: #2F3437">
      </div>
    </sc-if>
  </div>
  <div style="padding: 16px 20px 34px; display: flex; flex-direction: column; gap: 10px">
    <a href="Accueil.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 58px; border-radius: 18px; background: #4F7A5A; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>{{ t.pay }}</a>
    <div style="text-align: center; font-size: 12px; color: #646B6F">{{ t.cancel }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr","section":"Langue"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 'om' }; }
  renderVals() {
    const L = this.props.lang || 'fr';
    const fr = L === 'fr';
    const t = fr
      ? { back: 'Retour', title: 'Paiement', video: 'Vidéo', when: 'Mardi 24 novembre · 10:30', how: 'Payer avec', number: 'Numéro Mobile Money', pay: 'Payer 12 000 FCFA', cancel: 'Annulation gratuite jusqu\'à 24 h avant', card: 'Carte bancaire' }
      : { back: 'Back', title: 'Payment', video: 'Video', when: 'Tuesday, November 24 · 10:30', how: 'Pay with', number: 'Mobile Money number', pay: 'Pay 12,000 FCFA', cancel: 'Free cancellation up to 24 h before', card: 'Bank card' };
    const list = [
      { id: 'om', short: 'OM', label: 'Orange Money', bg: '#FCE3CF', fg: '#9A4A12' },
      { id: 'mtn', short: 'MTN', label: 'MTN MoMo', bg: '#FBF0B8', fg: '#6B5A00' },
      { id: 'cb', short: 'CB', label: t.card, bg: '#E7EFE4', fg: '#2F5238' }
    ];
    return {
      t,
      isMobile: this.state.m !== 'cb',
      methods: list.map((x) => {
        const on = x.id === this.state.m;
        return Object.assign({}, x, {
          pick: () => this.setState({ m: x.id }),
          style: 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 2px solid ' + (on ? '#4F7A5A' : '#EFEAE2'),
          logoStyle: 'width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: ' + x.bg + '; color: ' + x.fg,
          radio: 'width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; border: ' + (on ? '7px solid #4F7A5A' : '2px solid #C9C2B6')
        });
      })
    };
  }
}
</script>
</body>
</html>
