<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes progrès / My progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.95)}
polyline{stroke-dasharray:1000;animation:tcDraw 1.6s ease-out both}
.tc-float{animation:tcFloat 5s ease-in-out infinite}
.tc-pulse{animation:tcPulse 2s ease-out infinite}
.tc-bar{transform-origin:left;animation:tcGrow 1s cubic-bezier(.2,.8,.2,1) .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; overflow: hidden; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Profil.dc.html" aria-label="{{ t.back }}" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2F3437; box-shadow: 0 2px 10px rgba(47,52,55,0.06)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">{{ t.title }}</h1>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 16px; background: #EFEAE2">
      <sc-for list="{{ tabs }}" as="x" hint-placeholder-count="3">
        <button onClick="{{ x.pick }}" style="{{ x.style }}">{{ x.label }}</button>
      </sc-for>
    </div>
    <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; box-shadow: 0 4px 16px rgba(47,52,55,0.05)">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px">
        <div>
          <div style="font-size: 13px; color: #646B6F">{{ t.today }}</div>
          <div style="font-size: 32px; font-weight: 700; line-height: 1.1">{{ current }}<span style="font-size: 15px; color: #646B6F; font-weight: 500"> {{ unit }}</span></div>
        </div>
        <span style="padding: 6px 10px; border-radius: 12px; background: #E7EFE4; color: #2F5238; font-size: 13px; font-weight: 600">{{ delta }}</span>
      </div>
      <svg width="318" height="170" viewBox="0 0 318 170" role="img" aria-label="{{ aria }}">
        <line x1="0" y1="20" x2="318" y2="20" stroke="#F0EBE3"/>
        <line x1="0" y1="70" x2="318" y2="70" stroke="#F0EBE3"/>
        <line x1="0" y1="120" x2="318" y2="120" stroke="#F0EBE3"/>
        <line x1="0" y1="{{ goalY }}" x2="318" y2="{{ goalY }}" stroke="#E0704F" stroke-dasharray="5 5" stroke-width="1.5"/>
        <text x="318" y="{{ goalLabelY }}" text-anchor="end" font-size="11" font-weight="600" fill="#A9482F" font-family="Poppins, sans-serif">{{ goalText }}</text>
        <path d="{{ area }}" fill="#E7EFE4"/>
        <polyline points="{{ pts }}" fill="none" stroke="#4F7A5A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="{{ lastX }}" cy="{{ lastY }}" r="6" fill="#FFFFFF" stroke="#4F7A5A" stroke-width="3"/>
        <text x="4" y="164" font-size="11" fill="#646B6F" font-family="Poppins, sans-serif">{{ t.start }}</text>
        <text x="314" y="164" text-anchor="end" font-size="11" fill="#646B6F" font-family="Poppins, sans-serif">{{ t.end }}</text>
      </svg>
    </section>
    <section>
      <h2 style="margin: 0 0 10px; font-size: 17px; font-weight: 600">{{ t.badges }}</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(47,52,55,0.05)">
          <div style="width: 48px; height: 48px; border-radius: 50%; background: #E7EFE4; display: flex; align-items: center; justify-content: center; color: #3E6448"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg></div>
          <span style="font-size: 12px; font-weight: 500; text-align: center; line-height: 1.3">{{ t.b1 }}</span>
        </div>
        <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(47,52,55,0.05)">
          <div style="width: 48px; height: 48px; border-radius: 50%; background: #FCE9E0; display: flex; align-items: center; justify-content: center; color: #A9482F"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c2 4 6 5 6 10a6 6 0 0 1-12 0c0-3 2-4 2-6 2 1 3 2 4-4z"/></svg></div>
          <span style="font-size: 12px; font-weight: 500; text-align: center; line-height: 1.3">{{ t.b2 }}</span>
        </div>
        <div style="background: #FFFFFF; border-radius: 20px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(47,52,55,0.05)">
          <div style="width: 48px; height: 48px; border-radius: 50%; background: #FBF0C9; display: flex; align-items: center; justify-content: center; color: #7A5C00"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 21l5-3 5 3-1.5-7"/></svg></div>
          <span style="font-size: 12px; font-weight: 500; text-align: center; line-height: 1.3">{{ t.b3 }}</span>
        </div>
      </div>
    </section>
  </div>
  <nav style="display: flex; justify-content: space-around; padding: 8px 6px 24px; background: #FFFFFF; border-top: 1px solid #EFEAE2">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>{{ n.home }}</a>
    <a href="Reservation.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>{{ n.agenda }}</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>{{ n.journal }}</a>
    <a href="Messages.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>{{ n.messages }}</a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #3E6448; font-size: 11px; font-weight: 700"><span style="display: flex; padding: 2px 14px; border-radius: 12px; background: #E7EFE4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>{{ n.profile }}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr","section":"Langue"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0 }; }
  renderVals() {
    const L = this.props.lang || 'fr';
    const fr = L === 'fr';
    const t = fr
      ? { back: 'Retour', title: 'Mes progrès', today: 'Aujourd\'hui', start: '24 août', end: '15 nov.', badges: 'Mes badges', b1: '1re séance', b2: '14 jours de journal', b3: '−4 kg', tabs: ['Poids', 'IMC', 'Taille'], goal: 'Objectif', since: 'en 12 sem.' }
      : { back: 'Back', title: 'My progress', today: 'Today', start: 'Aug 24', end: 'Nov 15', badges: 'My badges', b1: '1st session', b2: '14-day journal streak', b3: '−4 kg', tabs: ['Weight', 'BMI', 'Waist'], goal: 'Goal', since: 'in 12 wks' };
    const n = fr ? { home: 'Accueil', agenda: 'Agenda', journal: 'Journal', messages: 'Messages', profile: 'Profil' } : { home: 'Home', agenda: 'Schedule', journal: 'Journal', messages: 'Messages', profile: 'Profile' };
    const w = [84.0, 83.4, 83.1, 82.5, 82.2, 81.6, 81.4, 80.9, 80.5, 80.2, 79.9, 79.6];
    const series = [
      { unit: 'kg', data: w, goal: 75, min: 74, max: 85 },
      { unit: '', data: w.map((x) => x / (1.65 * 1.65)), goal: 27.5, min: 27, max: 31.5 },
      { unit: 'cm', data: [98, 97.5, 97, 96, 95.5, 95, 94.5, 94, 93.5, 93, 92.5, 92], goal: 88, min: 87, max: 99 }
    ];
    const s = series[this.state.tab];
    const H = 140, top = 10;
    const y = (v) => top + (s.max - v) / (s.max - s.min) * H;
    const x = (i) => 6 + i * (306 / (s.data.length - 1));
    const coords = s.data.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
    const fmt = (v) => fr ? v.toFixed(1).replace('.', ',') : v.toFixed(1);
    const last = s.data[s.data.length - 1], first = s.data[0];
    const on = 'height: 42px; border: none; border-radius: 12px; background: #FFFFFF; color: #2F3437; font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(47,52,55,0.08)';
    const off = 'height: 42px; border: none; border-radius: 12px; background: transparent; color: #646B6F; font-size: 14px; font-weight: 500';
    return {
      t, n,
      tabs: t.tabs.map((label, i) => ({ label, style: i === this.state.tab ? on : off, pick: () => this.setState({ tab: i }) })),
      current: fmt(last), unit: s.unit,
      delta: '−' + fmt(first - last) + (s.unit ? ' ' + s.unit : '') + ' ' + t.since,
      pts: coords.join(' '),
      area: 'M' + coords.join(' L') + ' L' + x(s.data.length - 1) + ',' + (top + H) + ' L' + x(0) + ',' + (top + H) + ' Z',
      lastX: x(s.data.length - 1), lastY: y(last),
      goalY: y(s.goal), goalLabelY: y(s.goal) - 6, goalText: t.goal + ' ' + fmt(s.goal) + (s.unit ? ' ' + s.unit : ''),
      aria: t.title + ' — ' + t.tabs[this.state.tab]
    };
  }
}
</script>
</body>
</html>
