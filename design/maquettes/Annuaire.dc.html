<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Annuaire / Find a dietitian</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.95)}
polyline{stroke-dasharray:1000;animation:tcDraw 1.6s ease-out both}
.tc-float{animation:tcFloat 5s ease-in-out infinite}
.tc-pulse{animation:tcPulse 2s ease-out infinite}
.tc-bar{transform-origin:left;animation:tcGrow 1s cubic-bezier(.2,.8,.2,1) .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2">{{ t.title }}</h1>
    <div style="display: flex; gap: 10px">
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(47,52,55,0.05)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#646B6F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input aria-label="{{ t.search }}" placeholder="{{ t.search }}" style="flex: 1; min-width: 0; border: none; outline: none; font-size: 15px; background: transparent; color: #2F3437">
      </div>
      <button aria-label="{{ t.filters }}" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: #FFFFFF; color: #2F3437; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(47,52,55,0.05)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 5px; border-radius: 16px; background: #EFEAE2">
      <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
        <button onClick="{{ m.pick }}" style="{{ m.style }}">{{ m.label }}</button>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{ list }}" as="d" hint-placeholder-count="3">
      <article style="background: #FFFFFF; border-radius: 24px; padding: 16px; box-shadow: 0 4px 16px rgba(47,52,55,0.06); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="{{ d.avatar }}">{{ d.initials }}</div>
          <div style="flex: 1; min-width: 0">
            <div style="font-weight: 600; font-size: 16px">{{ d.name }}</div>
            <div style="font-size: 13px; color: #646B6F">{{ d.spec }}</div>
            <div style="font-size: 12px; color: #646B6F">{{ d.langs }}</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <div>
            <div style="font-size: 12px; color: #646B6F">{{ t.next }}</div>
            <div style="font-size: 14px; font-weight: 600; color: #A9482F">{{ d.slot }}</div>
          </div>
          <a href="Reservation.dc.html" style="height: 46px; padding: 0 20px; border-radius: 16px; background: #4F7A5A; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center">{{ t.book }}</a>
        </div>
      </article>
    </sc-for>
  </div>
  <nav style="display: flex; justify-content: space-around; padding: 8px 6px 24px; background: #FFFFFF; border-top: 1px solid #EFEAE2">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>{{ n.home }}</a>
    <a href="Reservation.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #3E6448; font-size: 11px; font-weight: 700"><span style="display: flex; padding: 2px 14px; border-radius: 12px; background: #E7EFE4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>{{ n.agenda }}</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>{{ n.journal }}</a>
    <a href="Messages.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>{{ n.messages }}</a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>{{ n.profile }}</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr","section":"Langue"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 0 }; }
  renderVals() {
    const L = this.props.lang || 'fr';
    const fr = L === 'fr';
    const t = fr
      ? { title: 'Trouver ma diététicienne', search: 'Nom ou spécialité', filters: 'Filtres', next: 'Prochain créneau', book: 'Réserver', modes: ['Tous', 'Vidéo', 'Cabinet'] }
      : { title: 'Find my dietitian', search: 'Name or specialty', filters: 'Filters', next: 'Next available', book: 'Book', modes: ['All', 'Video', 'In person'] };
    const n = fr ? { home: 'Accueil', agenda: 'Agenda', journal: 'Journal', messages: 'Messages', profile: 'Profil' } : { home: 'Home', agenda: 'Schedule', journal: 'Journal', messages: 'Messages', profile: 'Profile' };
    const all = [
      { initials: 'EM', name: 'Estelle Mbarga', spec: fr ? 'Yaoundé · Diabète, perte de poids' : 'Yaoundé · Diabetes, weight loss', langs: fr ? 'Français · Anglais · Ewondo' : 'French · English · Ewondo', slot: fr ? 'Mar. 24 nov. · 10:30' : 'Tue, Nov 24 · 10:30', video: true, inPerson: true, bg: '#F6C7B4', fg: '#7A3522' },
      { initials: 'SF', name: 'Serge Fotso', spec: fr ? 'Douala · Diabète, sport' : 'Douala · Diabetes, sports', langs: fr ? 'Anglais · Français · Pidgin' : 'English · French · Pidgin', slot: fr ? 'Jeu. 19 nov. · 17:00' : 'Thu, Nov 19 · 17:00', video: true, inPerson: false, bg: '#CFE0CB', fg: '#2F5238' },
      { initials: 'AB', name: 'Aïssatou Bello', spec: fr ? 'Yaoundé · Grossesse, enfants' : 'Yaoundé · Pregnancy, children', langs: fr ? 'Français · Fulfulde' : 'French · Fulfulde', slot: fr ? 'Ven. 20 nov. · 09:00' : 'Fri, Nov 20 · 09:00', video: false, inPerson: true, bg: '#FCE9E0', fg: '#7A3522' }
    ];
    const m = this.state.mode;
    const list = all.filter((d) => m === 0 || (m === 1 && d.video) || (m === 2 && d.inPerson)).map((d) => Object.assign({}, d, {
      avatar: 'width: 56px; height: 56px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; background: ' + d.bg + '; color: ' + d.fg
    }));
    const on = 'height: 42px; border: none; border-radius: 12px; background: #FFFFFF; color: #2F3437; font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(47,52,55,0.08)';
    const off = 'height: 42px; border: none; border-radius: 12px; background: transparent; color: #646B6F; font-size: 14px; font-weight: 500';
    return {
      t, n, list,
      modes: t.modes.map((label, i) => ({ label, style: i === m ? on : off, pick: () => this.setState({ mode: i }) }))
    };
  }
}
</script>
</body>
</html>
