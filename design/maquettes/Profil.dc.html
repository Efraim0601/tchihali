<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Profil / Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
@keyframes tcRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tcPulse{0%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}70%{box-shadow:0 0 0 12px rgba(224,112,79,0)}100%{box-shadow:0 0 0 0 rgba(224,112,79,0)}}
@keyframes tcDraw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes tcGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tcSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes tcFade{from{opacity:0}to{opacity:1}}
h1,h2,p,section,article{animation:tcRise .6s cubic-bezier(.2,.8,.2,1) both}
h1{animation-delay:.05s}p{animation-delay:.12s}
section:nth-of-type(2),article:nth-of-type(2){animation-delay:.1s}
section:nth-of-type(3),article:nth-of-type(3){animation-delay:.18s}
section:nth-of-type(4),article:nth-of-type(4){animation-delay:.26s}
button,a,input{transition:transform .18s ease,background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease}
button:active,a:active{transform:scale(.97)}
.tc-sheet{animation:tcSheet .35s cubic-bezier(.2,.8,.2,1) both}
.tc-fade{animation:tcFade .25s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F2; font-family: 'Poppins', sans-serif; color: #2F3437; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="flex: 1; overflow: hidden; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">{{ t.title }}</h1>
    <section style="background: #FFFFFF; border-radius: 24px; padding: 16px; box-shadow: 0 4px 16px rgba(47,52,55,0.05); display: flex; gap: 14px; align-items: center">
      <div style="width: 60px; height: 60px; border-radius: 20px; background: #F6C7B4; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #7A3522">NN</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 17px; font-weight: 600">Nadège Ngono</div>
        <div style="font-size: 13px; color: #646B6F">+237 677 21 36 90</div>
      </div>
      <button aria-label="{{ t.edit }}" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #F5F1EA; color: #2F3437; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
    </section>
    <section style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px; box-shadow: 0 4px 16px rgba(47,52,55,0.05); display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 13px; background: #E3E8EE; color: #34495E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span>
        <span style="font-size: 15px; font-weight: 500">{{ t.language }}</span>
      </div>
      <div role="group" aria-label="{{ t.language }}" style="display: flex; padding: 4px; border-radius: 14px; background: #EFEAE2; gap: 2px">
        <button onClick="{{ setFr }}" aria-pressed="{{ isFr }}" style="{{ frStyle }}">Français</button>
        <button onClick="{{ setEn }}" aria-pressed="{{ isEn }}" style="{{ enStyle }}">English</button>
      </div>
    </section>
    <section style="background: #FFFFFF; border-radius: 24px; padding: 6px 16px; box-shadow: 0 4px 16px rgba(47,52,55,0.05); display: flex; flex-direction: column">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
        <a href="{{ m.href }}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; text-decoration: none; color: #2F3437; border-bottom: {{ m.border }}">
          <span style="{{ m.icon }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ m.path }}"/></svg></span>
          <span style="flex: 1; font-size: 15px; font-weight: 500">{{ m.label }}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7AAA6" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </sc-for>
    </section>
    <button onClick="{{ askLogout }}" style="height: 54px; border-radius: 18px; border: 1.5px solid #F2C9BB; background: #FFFFFF; color: #A9482F; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>{{ t.logout }}</button>
  </div>
  <nav style="display: flex; justify-content: space-around; padding: 8px 6px 24px; background: #FFFFFF; border-top: 1px solid #EFEAE2">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>{{ n.home }}</a>
    <a href="Reservation.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>{{ n.agenda }}</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>{{ n.journal }}</a>
    <a href="Messages.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #646B6F; font-size: 11px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>{{ n.messages }}</a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #3E6448; font-size: 11px; font-weight: 700"><span style="display: flex; padding: 2px 14px; border-radius: 12px; background: #E7EFE4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>{{ n.profile }}</a>
  </nav>
  <sc-if value="{{ confirm }}" hint-placeholder-val="{{ false }}">
    <div class="tc-fade" style="position: absolute; inset: 0; background: rgba(47,52,55,0.45); display: flex; align-items: flex-end">
      <div class="tc-sheet" role="dialog" aria-modal="true" aria-label="{{ t.sureTitle }}" style="width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 14px 20px 34px; display: flex; flex-direction: column; gap: 14px">
        <span style="align-self: center; width: 44px; height: 5px; border-radius: 5px; background: #E4DED4"></span>
        <div style="font-size: 20px; font-weight: 700; text-align: center">{{ t.sureTitle }}</div>
        <div style="font-size: 15px; color: #646B6F; text-align: center; line-height: 1.5">{{ t.sureText }}</div>
        <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 18px; background: #C4533A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">{{ t.logout }}</a>
        <button onClick="{{ cancel }}" style="height: 54px; border-radius: 18px; border: 1.5px solid #E4DED4; background: #FFFFFF; color: #2F3437; font-weight: 600; font-size: 16px">{{ t.cancel }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fr","en"],"default":"fr","section":"Langue"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { lang: null, confirm: false }; }
  renderVals() {
    const L = this.state.lang || this.props.lang || 'fr';
    const fr = L === 'fr';
    const t = fr
      ? { title: 'Mon profil', edit: 'Modifier', language: 'Langue', logout: 'Se déconnecter', cancel: 'Annuler', sureTitle: 'Se déconnecter ?', sureText: 'Vos données restent sauvegardées. Reconnectez-vous avec votre numéro.', menu: ['Mes progrès', 'Mon carnet de suivi', 'Mes informations de santé', 'Notifications', 'Aide et contact'] }
      : { title: 'My profile', edit: 'Edit', language: 'Language', logout: 'Log out', cancel: 'Cancel', sureTitle: 'Log out?', sureText: 'Your data stays saved. Log back in with your phone number.', menu: ['My progress', 'My care record', 'My health information', 'Notifications', 'Help and contact'] };
    const n = fr ? { home: 'Accueil', agenda: 'Agenda', journal: 'Journal', messages: 'Messages', profile: 'Profil' } : { home: 'Home', agenda: 'Schedule', journal: 'Journal', messages: 'Messages', profile: 'Profile' };
    const hrefs = ['Progres.dc.html', 'Carnet.dc.html', 'Questionnaire.dc.html', 'Profil.dc.html', 'Messages.dc.html'];
    const paths = ['M4 18l5-6 4 3 7-9', 'M6 3h9l4 4v14H6zM9 12h7M9 16h5', 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z', 'M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0', 'M12 17v.01M12 13a2 2 0 1 0-2-2M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18z'];
    const tints = [['#E7EFE4', '#2F5238'], ['#FBF0C9', '#5E4700'], ['#FCE9E0', '#8A3A24'], ['#E3E8EE', '#34495E'], ['#F3EFE8', '#4A5054']];
    const on = 'height: 36px; padding: 0 12px; border: none; border-radius: 11px; background: #FFFFFF; color: #2F3437; font-size: 13px; font-weight: 600; box-shadow: 0 2px 6px rgba(47,52,55,0.1)';
    const off = 'height: 36px; padding: 0 12px; border: none; border-radius: 11px; background: transparent; color: #646B6F; font-size: 13px; font-weight: 500';
    return {
      t, n, isFr: fr, isEn: !fr,
      frStyle: fr ? on : off, enStyle: fr ? off : on,
      setFr: () => this.setState({ lang: 'fr' }), setEn: () => this.setState({ lang: 'en' }),
      menu: t.menu.map((label, i) => ({
        label, href: hrefs[i], path: paths[i],
        border: i < t.menu.length - 1 ? '1px solid #F0EBE3' : 'none',
        icon: 'width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + tints[i][0] + '; color: ' + tints[i][1]
      })),
      confirm: this.state.confirm,
      askLogout: () => this.setState({ confirm: true }),
      cancel: () => this.setState({ confirm: false })
    };
  }
}
</script>
</body>
</html>
