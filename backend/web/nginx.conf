server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Application monopage : toute adresse inconnue renvoie index.html (navigation go_router).
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Fichiers qui changent à chaque version : jamais en cache.
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }
}
