name: tchihali
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.16

flutter:
  uses-material-design: true
  generate: true
  assets:
    - google_fonts/

# Icône de l'application (flutter pub run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: assets/branding/icon_foreground.png

# Écran de lancement (dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#FAF7F2"
  image: assets/branding/splash.png
  android_12:
    color: "#FAF7F2"
    image: assets/branding/splash.png
